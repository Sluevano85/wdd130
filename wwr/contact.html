<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us: So Cal White Water Rafting</title>
  <meta name="description"
    content="Contact So Cal White Water Rafting to ask questions about private and group tours">
  <meta name="author" content="Sean Luevano">
  <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>

  <header>
    <img src="images/z-splash.jpg" alt="So Cal White Water Rafting logo" width="500" height="500">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>

    </nav>
  </header>

  <main>
    <h1>Contact Us</h1>
    <h2> So Cal White Water Rafting</h2>
    <address>321 Tricky Mountain Rd<br>
      Los Angeles Forest, California<br>
      <a href="tel:3234422343">323-442-2343</a><br>
      <a href="mailto:socalwwr@wwr.com">socalwwr@wwr.com</a>
    </address> <iframe title="Map of our location"
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3291.606796327684!2d-118.17767512426806!3d34.41133887302386!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80c2dbef4714d959%3A0xaa04bea62fc51d91!2sAngeles%20National%20Forest!5e0!3m2!1sen!2sus!4v1791669557962!5m2!1sen!2sus"
      width="400" height="300" allowfullscreen="" loading="lazy"
      referrerpolicy="strict-origin-when-cross-origin"></iframe>
    <section class="staff">
      <figure>
        <img src="images/carl.jpg" alt="Photo of Carl" width="200" height="200">
        <figcaption> Carl, Captain</figcaption>
      </figure>
      <figure>
        <img src="images/katia.jpg" alt="Photo of Katia" width="200" height="200">
        <figcaption> Katia, Lead Guide</figcaption>
      </figure>
      <figure>
        <img src="images/louie.jpg" alt="Photo of Louie" width="200" height="200">
        <figcaption> Louie, Head Navigator</figcaption>
      </figure>
    </section>
    <form>
      <label for="username"> Name</label>
      <input type="text" id="username" name="username">

      <label for="email"> Email</label>
      <input type="email" id="email" name="email">

      <fieldset>
        <legend> Purpose of your message</legend>

        <input type="radio" id="general" name="purpose" value="general">
        <label for="general">General Inquiry</label>

        <input type="radio" id="reservation" name="purpose" value="reservation">
        <label for="reservation">Reservation Question</label>

        <input type="radio" id="suggestion" name="purpose" value="suggestion">
        <label for="suggestion">Website Suggestion</label>

      </fieldset>
      <label for="message">Message</label>
      <textarea id="message" name="message"></textarea>

      <input type="checkbox" id="newsletter" name="newsletter">
      <label for="newsletter">Please subscribe me to the monthly newsletter</label>
      <button type="submit">Send Message</button>

    </form>


  </main>

  <footer>
    <p>&copy; | 2026 | So Cal White Water Rafting | Sean Luevano</p>

    <nav class="socialmedia">
      <a href="http://facebook.com">
        <img src="images/facebook.svg" alt="Facebook Icon">
      </a>
      <a href="https://linkedin.com">
        <img src="images/linkedin.svg" alt="LinkedIn Icon">
      </a>
      <a href="https://instagram.com">
        <img src="images/instagram.svg" alt="Instagram Icon">
      </a>

    </nav>
  </footer>

</body>


</html>
